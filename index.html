<script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwNOesHzI36xyW74MTExoK_pLWGkL8yzukwwN63AvrsSgsAw3F42AhovG5VMe5W1Frz/exec';
    
    const pageTitles = {
        dashboard: ['Dashboard', 'Ringkasan data dan aktivitas terbaru'],
        struktur: ['Struktur Organisasi', 'Bagan dan daftar pengurus'],
        anggota: ['Data Anggota', 'Kelola keanggotaan paguyuban'],
        iuran: ['Data Iuran', 'Catatan iuran bulanan anggota'],
        santunan: ['Data Santunan', 'Riwayat penyaluran santunan'],
        neraca: ['Neraca Keuangan', 'Catatan pemasukan dan pengeluaran']
    };

    const BULANS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    const PAGE_SIZE = 10;
    let chartInstances = [];
    let currentLoadId = 0;

    function esc(str) { const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
    function escAttr(str) { return String(str || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function formatRupiah(n) { const abs = Math.abs(Number(n || 0)); const formatted = abs.toLocaleString('id-ID'); return Number(n || 0) < 0 ? '-Rp ' + formatted : 'Rp ' + formatted; }
    function debounce(fn, ms = 300) { let t; return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); }; }

    // HELPER UNTUK DROPDOWN
    function generateAnggotaOptions(data, selectedNama = '') {
        let opts = '<option value="">Pilih Anggota</option>';
        data.forEach(a => {
            const sel = a.nama === selectedNama ? 'selected' : '';
            opts += `<option value="${escAttr(a.nama)}" ${sel}>${esc(a.nama)} (${esc(a.id_anggota || a.id)})</option>`;
        });
        return opts;
    }
    function generateBulanOptions(selectedBulan = '') {
        let opts = '<option value="">Pilih Bulan</option>';
        BULANS.forEach(b => { opts += `<option value="${b}" ${b===selectedBulan?'selected':''}>${b}</option>`; });
        return opts;
    }
    function generateTahunOptions(selectedTahun = '') {
        let opts = '<option value="">Pilih Tahun</option>';
        const curYear = new Date().getFullYear();
        for(let y = curYear + 1; y >= curYear - 5; y--) {
            opts += `<option value="${y}" ${String(y)===String(selectedTahun)?'selected':''}>${y}</option>`;
        }
        return opts;
    }

    function cetakData(judul, elemId) { const content = document.getElementById(elemId); if (!content) return showToast('Data tidak ditemukan', 'error'); const printWindow = window.open('', '_blank', 'width=800,height=600'); printWindow.document.write(`<html><head><title>${esc(judul)}</title><style>body { font-family: 'Plus Jakarta Sans', Arial, sans-serif; padding: 20px; background: white; color: #333; font-size: 12px; } h2 { text-align: center; margin-bottom: 5px; font-size: 18px;} p.subtitle { text-align: center; font-size: 12px; color: #666; margin-bottom: 20px; } hr { border: 0; border-top: 1px solid #ddd; margin-bottom: 20px; } table { width: 100%; border-collapse: collapse; margin-top: 10px; } th, td { border: 1px solid #ddd; padding: 8px; text-align: left; } th { background-color: #f4f4f4; font-weight: 600; font-size: 11px; text-transform: uppercase; } td { font-size: 12px; } .no-print { display: none; } @media print { body { padding: 0; } }</style></head><body><h2>${esc(judul)}</h2><p class="subtitle">Dicetak pada: ${new Date().toLocaleString('id-ID')}</p><hr>${content.innerHTML}</body></html>`); printWindow.document.close(); setTimeout(() => { printWindow.focus(); printWindow.print(); }, 500); }
    function generateMonthYearFilter(idPrefix) { let optsBulan = '<option value="">Semua Bulan</option>'; BULANS.forEach(b => optsBulan += `<option value="${b}">${b}</option>`); let optsTahun = '<option value="">Semua Tahun</option>'; const currentYear = new Date().getFullYear(); for(let y = currentYear + 1; y >= currentYear - 5; y--) { optsTahun += `<option value="${y}">${y}</option>`; } return `<div class="flex gap-2 items-center"><select id="${idPrefix}Bulan" class="py-2 px-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-xs font-medium">${optsBulan}</select><select id="${idPrefix}Tahun" class="py-2 px-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-xs font-medium">${optsTahun}</select></div>`; }

    let _confirmCallback = null;
    function showConfirm(opts = {}) { const { title = 'Konfirmasi', msg = 'Apakah Anda yakin?', okText = 'Hapus', okColor = 'bg-red-500 hover:bg-red-600', icon = 'fa-exclamation-triangle', iconColor = 'text-red-500', iconBg = 'bg-red-100 dark:bg-red-900/30', onConfirm = null } = opts; _confirmCallback = onConfirm; document.getElementById('confirmTitle').textContent = title; document.getElementById('confirmMsg').textContent = msg; document.getElementById('confirmOk').textContent = okText; document.getElementById('confirmOk').className = `flex-1 py-2.5 rounded-xl text-white text-sm font-medium transition-colors ${okColor}`; document.getElementById('confirmIcon').className = `fas ${icon} ${iconColor} text-2xl`; document.getElementById('confirmIconWrap').className = `w-16 h-16 ${iconBg} rounded-full flex items-center justify-center mx-auto mb-4`; document.getElementById('confirmDialog').classList.remove('hidden'); }
    function onConfirmOk() { document.getElementById('confirmDialog').classList.add('hidden'); if (_confirmCallback) { _confirmCallback(); _confirmCallback = null; } }
    function onConfirmCancel() { document.getElementById('confirmDialog').classList.add('hidden'); _confirmCallback = null; }
    function doLogout() { localStorage.removeItem('user'); document.getElementById('mainApp').classList.add('hidden'); document.getElementById('loginScreen').classList.remove('hidden'); document.getElementById('username').value = ''; document.getElementById('password').value = ''; document.getElementById('btnLogin').disabled = false; document.getElementById('btnLogin').innerHTML = '<i class="fas fa-arrow-right-to-bracket mr-2"></i>MASUK'; showToast('Berhasil logout', 'info'); }

    async function api(action, params = {}) { try { let res; if (action.startsWith('get') || action.startsWith('delete') || action === 'login') { params.action = action; res = await fetch(`${API_URL}?${new URLSearchParams(params).toString()}`); } else { params.action = action; res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(params) }); } const data = await res.json(); if (!data.success) throw new Error(data.message || 'Gagal memproses permintaan'); return data; } catch (err) { showToast(err.message, 'error'); return null; } }

    function showToast(msg, type = 'success') { const c = document.getElementById('toastContainer'); const t = document.createElement('div'); const colors = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600'; const icons = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle'; t.className = `toast-enter ${colors} p-4 rounded-xl shadow-2xl text-white flex items-start gap-3`; t.innerHTML = `<i class="fas ${icons} mt-0.5"></i><div class="flex-1"><p class="text-sm font-medium">${esc(msg)}</p></div><button onclick="this.parentElement.classList.replace('toast-enter','toast-exit');setTimeout(()=>this.parentElement.remove(),300)" class="text-white/70 hover:text-white"><i class="fas fa-times text-xs"></i></button>`; c.appendChild(t); setTimeout(() => { if(t.parentElement) { t.classList.replace('toast-enter','toast-exit'); setTimeout(() => t.remove(), 300); } }, 4000); }

    function emptyState(icon, msg) { return `<div class="flex flex-col items-center justify-center py-12 text-gray-400"><div class="w-20 h-20 bg-gray-100 dark:bg-gray-800 rounded-2xl flex items-center justify-center mb-4"><i class="fas ${icon} text-3xl"></i></div><p class="text-sm">${esc(msg)}</p></div>`; }
    function paginate(data, page) { const total = Math.max(1, Math.ceil(data.length / PAGE_SIZE)); const p = Math.max(1, Math.min(page, total)); const slice = data.slice((p - 1) * PAGE_SIZE, p * PAGE_SIZE); return { slice, page: p, total, count: data.length }; }

    async function initNeraca(loadId) { const c = document.getElementById('contentArea'); c.innerHTML = `<div class="bg-white dark:bg-darkCard p-6 rounded-2xl border border-gray-100 dark:border-gray-700/50"><div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6"><div><h3 class="font-semibold text-lg">Neraca Keuangan</h3><p class="text-xs text-gray-400">Catatan pemasukan dan pengeluaran</p></div><div class="flex flex-wrap gap-3 items-center">${generateMonthYearFilter('neraca')}<div class="relative"><i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i><input type="text" id="searchNeraca" placeholder="Cari transaksi..." class="pl-9 pr-4 py-2.5 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm w-52"></div><button id="btnCetakNeraca" class="btn-secondary text-gray-700 dark:text-gray-300 px-5 py-2.5 rounded-xl text-sm font-medium shadow-sm"><i class="fas fa-print mr-2"></i>Cetak</button><button id="btnAddNeraca" class="btn-primary text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-lg"><i class="fas fa-plus mr-2"></i>Tambah</button></div></div><div id="printAreaNeraca" class="overflow-x-auto"><table class="w-full text-left"><thead><tr class="border-b dark:border-gray-700"><th class="pb-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Tanggal</th><th class="pb-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Keterangan</th><th class="pb-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Debit</th><th class="pb-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Kredit</th><th class="pb-3 text-xs font-semibold text-gray-500 uppercase tracking-wider">Saldo</th><th class="pb-3 text-xs font-semibold text-gray-500 uppercase tracking-wider text-right no-print">Aksi</th></tr></thead><tbody id="tBody" class="divide-y dark:divide-gray-700/50"></tbody></table></div><div id="paginationNeraca"></div></div>`; const res = await api('getNeraca'); if (currentLoadId !== loadId) return; const data = res?.data || []; let currentPage = 1; let filteredData = [...data]; function applyNeracaFilter() { const q = document.getElementById('searchNeraca')?.value.toLowerCase() || ''; const fBulan = document.getElementById('neracaBulan')?.value || ''; const fTahun = document.getElementById('neracaTahun')?.value || ''; filteredData = data.filter(i => { const matchQ = i.keterangan?.toLowerCase().includes(q) || i.tanggal?.includes(q); const tgl = i.tanggal ? new Date(i.tanggal) : null; const bulan = tgl ? BULANS[tgl.getMonth()] : ''; const tahun = tgl ? String(tgl.getFullYear()) : ''; const matchBulan = !fBulan || bulan === fBulan; const matchTahun = !fTahun || tahun === fTahun; return matchQ && matchBulan && matchTahun; }); currentPage = 1; renderTable(); } function renderTable() { let startSaldo = 0; const prevData = filteredData.slice(0, (currentPage - 1) * PAGE_SIZE); prevData.forEach(i => startSaldo += Number(i.debit||0) - Number(i.kredit||0)); const p = paginate(filteredData, currentPage); document.getElementById('tBody').innerHTML = p.slice.length === 0 ? `<tr><td colspan="6" class="py-8">${emptyState('fa-balance-scale','Tidak ada data ditemukan')}</td></tr>` : p.slice.map((i) => { startSaldo += Number(i.debit||0) - Number(i.kredit||0); const s = startSaldo; return `<tr class="table-row"><td class="py-3.5 pr-4 text-sm text-gray-500 dark:text-gray-400">${esc(i.tanggal)}</td><td class="py-3.5 pr-4 text-sm font-medium">${esc(i.keterangan)}</td><td class="py-3.5 pr-4 text-sm font-semibold text-green-600 dark:text-green-400">${Number(i.debit||0)?formatRupiah(i.debit):'-'}</td><td class="py-3.5 pr-4 text-sm font-semibold text-red-600 dark:text-red-400">${Number(i.kredit||0)?formatRupiah(i.kredit):'-'}</td><td class="py-3.5 pr-4 text-sm font-bold ${s>=0?'text-blue-600 dark:text-blue-400':'text-red-600 dark:text-red-400'}">${formatRupiah(s)}</td><td class="py-3.5 text-right no-print"><div class="flex items-center justify-end gap-1"><button class="btn-action btn-edit w-8 h-8 flex items-center justify-center rounded-lg text-blue-500 hover:bg-blue-50 dark:hover:bg-blue-900/20" data-action="editNeraca" data-tanggal="${escAttr(i.tanggal)}" data-keterangan="${escAttr(i.keterangan)}"><i class="fas fa-pen text-xs"></i></button><button class="btn-action btn-edit w-8 h-8 flex items-center justify-center rounded-lg text-red-500 hover:bg-red-50 dark:hover:bg-red-900/20" data-action="hapusData" data-action-type="deleteNeraca" data-id-col="tanggal" data-id-val="${escAttr(i.tanggal)}" data-label="${escAttr(i.keterangan)}"><i class="fas fa-trash-alt text-xs"></i></button></div></td></tr>`; }).join(''); renderPagination('paginationNeraca', p.page, p.total, (pg) => { currentPage = pg; renderTable(); }); } renderTable(); window.editNeraca = function(tanggal, keterangan) { const item = data.find(i => i.tanggal === tanggal && i.keterangan === keterangan); if (!item) return; openModal(`<div class="p-6"><div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold">Edit Transaksi</h3><button id="btnCloseModal" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-times text-sm"></i></button></div><form id="crudForm" class="space-y-4"><input type="hidden" name="old_tanggal" value="${escAttr(item.tanggal)}"><input type="hidden" name="old_keterangan" value="${escAttr(item.keterangan)}"><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Tanggal</label><input type="date" name="tanggal" value="${escAttr(item.tanggal)}" required class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"></div><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Keterangan</label><input type="text" name="keterangan" value="${escAttr(item.keterangan)}" required class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"></div><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Tipe Transaksi</label><select name="tipe" class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"><option value="debit" ${Number(item.debit||0)>0?'selected':''}>Debit (Pemasukan)</option><option value="kredit" ${Number(item.kredit||0)>0?'selected':''}>Kredit (Pengeluaran)</option></select></div><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Nominal</label><input type="number" name="nominal" value="${Number(item.debit||0)||Number(item.kredit||0)}" required class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"></div><button type="submit" class="btn-primary w-full text-white p-3 rounded-xl font-semibold text-sm shadow-lg mt-2"><i class="fas fa-save mr-2"></i>Update Data</button></form></div>`); document.getElementById('crudForm').addEventListener('submit', e => simpanNeraca(e, 'editNeraca')); }; document.getElementById('searchNeraca')?.addEventListener('input', debounce(applyNeracaFilter, 250)); document.getElementById('neracaBulan')?.addEventListener('change', applyNeracaFilter); document.getElementById('neracaTahun')?.addEventListener('change', applyNeracaFilter); document.getElementById('btnAddNeraca').addEventListener('click', () => { openModal(`<div class="p-6"><div class="flex justify-between items-center mb-6"><h3 class="text-lg font-bold">Tambah Transaksi</h3><button id="btnCloseModal" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700"><i class="fas fa-times text-sm"></i></button></div><form id="crudForm" class="space-y-4"><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Tanggal</label><input type="date" name="tanggal" required class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"></div><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Keterangan</label><input type="text" name="keterangan" required class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"></div><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Tipe Transaksi</label><select name="tipe" class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"><option value="debit">Debit (Pemasukan)</option><option value="kredit">Kredit (Pengeluaran)</option></select></div><div><label class="text-xs font-medium text-gray-500 mb-1.5 block">Nominal</label><input type="number" name="nominal" required class="w-full p-3 border border-gray-200 dark:border-gray-600 rounded-xl dark:bg-darkCard outline-none text-sm"></div><button type="submit" class="btn-primary w-full text-white p-3 rounded-xl font-semibold text-sm shadow-lg mt-2"><i class="fas fa-save mr-2"></i>Simpan Data</button></form></div>`); document.getElementById('crudForm').addEventListener('submit', e => simpanNeraca(e, 'addNeraca')); }); document.getElementById('btnCetakNeraca')?.addEventListener('click', () => cetakData('Neraca Keuangan Paguyuban', 'printAreaNeraca')); c.classList.add('fade-up'); }

    // =============================================
    // GENERAL CRUD
    // =============================================
    async function simpanData(e, action) { e.preventDefault(); const btn = e.target.querySelector('button[type="submit"]'); const isEdit = action.startsWith('edit'); const label = isEdit ? 'Update Data' : 'Simpan Data'; btn.disabled = true; btn.innerHTML = '<div class="spinner w-5 h-5 border-2 border-white border-t-transparent rounded-full mx-auto"></div>'; const fd = new FormData(e.target); const p = Object.fromEntries(fd.entries()); const res = await api(action, p); if(res) { closeModal(); showToast(res.message); loadPage(document.querySelector('.nav-link.active')?.getAttribute('data-page')); } else { btn.disabled = false; btn.innerHTML = `<i class="fas fa-save mr-2"></i>${label}`; } }
    async function simpanNeraca(e, action) { e.preventDefault(); const btn = e.target.querySelector('button[type="submit"]'); const isEdit = action.startsWith('edit'); const label = isEdit ? 'Update Data' : 'Simpan Data'; btn.disabled = true; btn.innerHTML = '<div class="spinner w-5 h-5 border-2 border-white border-t-transparent rounded-full mx-auto"></div>'; const fd = new FormData(e.target); const p = Object.fromEntries(fd.entries()); const nominal = Number(p.nominal || 0); if(p.tipe === 'debit') { p.debit = nominal; p.kredit = 0; } else { p.kredit = nominal; p.debit = 0; } delete p.tipe; delete p.nominal; const res = await api(action, p); if(res) { closeModal(); showToast(res.message); loadPage(document.querySelector('.nav-link.active')?.getAttribute('data-page')); } else { btn.disabled = false; btn.innerHTML = `<i class="fas fa-save mr-2"></i>${label}`; } }
    function hapusData(action, idCol, idVal, label = '') { showConfirm({ title: 'Hapus Data', msg: `Apakah Anda yakin ingin menghapus${label ? ' "' + label + '"' : ' data ini'}? Tindakan ini tidak dapat dibatalkan.`, okText: 'Ya, Hapus', okColor: 'bg-red-500 hover:bg-red-600', icon: 'fa-trash-alt', iconColor: 'text-red-500', iconBg: 'bg-red-100 dark:bg-red-900/30', onConfirm: async () => { try { const p = {}; p[idCol] = idVal; const res = await api(action, p); if (res) { showToast(res.message); loadPage(document.querySelector('.nav-link.active')?.getAttribute('data-page')); } } catch (err) { showToast('Gagal menghapus: ' + err.message, 'error'); } } }); }
</script>
